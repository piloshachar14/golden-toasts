version: '3.8'

services:
  client:
    build: ./apps/client
    ports:
      - '4200:80'
  server:
    build: ./apps/server
    ports:
      - '3000:3001'
    environment:
      - POSTGRES_HOST=server
      - POSTGRES_PORT=5432
      - POSTGRES_PASSWORD=12345
      - POSTGRES_USER=postgres
      - POSTGRES_DB=postgres
    depends_on:
      - postgres

  postgres:
    image: postgres:latest
    environment:
      POSTGRES_PASSWORD: '12345'
      POSTGRES_USER: 'postgres'
      POSTGRES_DB: 'postgres'
    ports:
      - '5432:5432'
